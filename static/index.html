<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephemeral Paste - Secure Self-Destructing Notes</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #121824;
            --border: #232c3d;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        h1 { font-size: 1.5rem; color: #fff; }
        .badge {
            background: rgba(99, 102, 241, 0.2);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            height: 240px;
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            padding: 16px;
            font-family: Consolas, monospace;
            font-size: 0.95rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }
        textarea:focus { border-color: var(--accent); }
        .controls {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .options {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        select, input[type="text"] {
            background: #0b0f19;
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        button.btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn:hover { background: var(--accent-hover); }
        .result-box {
            display: none;
            margin-top: 24px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            padding: 16px;
            border-radius: 8px;
        }
        .result-box.active { display: block; }
        .result-url {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .result-url input { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔒 Ephemeral Paste</h1>
            <span class="badge">Burn-After-Reading</span>
        </header>

        <textarea id="pasteContent" placeholder="Paste your sensitive text, logs, tokens, or credentials here..."></textarea>

        <div class="controls">
            <div class="options">
                <select id="expiration">
                    <option value="burn">🔥 Burn on Read (1 View)</option>
                    <option value="300">⏱️ 5 Minutes</option>
                    <option value="3600">⏱️ 1 Hour</option>
                    <option value="86400">⏱️ 24 Hours</option>
                </select>
            </div>
            <button class="btn" id="createBtn" onclick="createPaste()">Create Secret Link</button>
        </div>

        <div class="result-box" id="resultBox">
            <p><strong>Your secret link is generated:</strong></p>
            <div class="result-url">
                <input type="text" id="pasteLink" readonly>
                <button class="btn" onclick="copyLink()">Copy</button>
            </div>
        </div>
    </div>

    <script>
        async function createPaste() {
            const content = document.getElementById('pasteContent').value.trim();
            if (!content) { alert('Please enter some content!'); return; }

            const exp = document.getElementById('expiration').value;
            const res = await fetch('/api/paste', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content, ttl: exp })
            });

            const data = await res.json();
            if (data.url) {
                document.getElementById('pasteLink').value = data.url;
                document.getElementById('resultBox').classList.add('active');
            } else {
                alert('Error creating paste.');
            }
        }

        function copyLink() {
            const link = document.getElementById('pasteLink');
            link.select();
            document.execCommand('copy');
            alert('Link copied to clipboard!');
        }
    </script>
</body>
</html>
